<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DF Legal | Detecção SR2D4</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root {
      --primary: #0056b3;
      --primary-dark: #003f84;
      --cyan: #087f8c;
      --bg: #f4f7f6;
      --text: #25313c;
      --muted: #5d6872;
      --border: #d8dee4;
      --success-bg: #d1e7dd;
      --success-text: #0f5132;
      --error-bg: #f8d7da;
      --error-text: #842029;
      --warning-bg: #fff3cd;
      --warning-text: #664d03;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 15px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .app-container {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 20px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .10);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }

    .header i { color: var(--primary); font-size: 24px; }
    .header h1 { margin: 0; color: var(--primary); font-size: 19px; }

    .step-title {
      margin-top: 18px;
      padding-bottom: 6px;
      border-bottom: 2px solid #e9ecef;
      color: var(--primary);
      font-size: 16px;
      font-weight: 700;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
      margin-top: 14px;
    }

    .form-group label,
    .map-help {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input[type="date"],
    input[type="file"],
    input[type="range"] {
      width: 100%;
    }

    input[type="date"], input[type="file"] {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #fff;
      font-size: 13px;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
    }

    #map {
      position: relative;
      width: 100%;
      height: 440px;
      margin-top: 8px;
      border: 2px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #dfe8ee;
      z-index: 1;
    }

    /* Mantém o controle da cortina acima dos tiles e impede que o arraste
       do polegar seja interpretado como pan do mapa. */
    #map .leaflet-control-container { z-index: 1100; }
    #map .leaflet-sbs { z-index: 1100; }
    #map .leaflet-sbs-range { z-index: 1101; }
    #map .leaflet-sbs-divider {
      width: 4px;
      margin-left: -2px;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .35), 0 0 8px rgba(0, 0, 0, .35);
    }

    .btn-primary,
    .btn-swipe,
    .btn-secondary {
      border: 0;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      transition: background-color .2s ease, opacity .2s ease;
    }

    .btn-primary {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      background: var(--primary);
      font-size: 16px;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { background: #999; cursor: not-allowed; }

    .btn-swipe { padding: 9px 14px; background: var(--cyan); font-size: 13px; }
    .btn-swipe:hover { background: #05636d; }

    .btn-secondary {
      display: inline-block;
      padding: 10px 14px;
      background: #212529;
      text-decoration: none;
      font-size: 14px;
    }
    .btn-secondary:hover { background: #000; }

    #status-box {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }
    .status-loading { background: #e2f0fe; color: var(--primary); border: 1px solid #b6d4fe; }
    .status-success { background: var(--success-bg); color: var(--success-text); border: 1px solid #badbcc; }
    .status-error { background: var(--error-bg); color: var(--error-text); border: 1px solid #f5c2c7; }
    .status-warning { background: var(--warning-bg); color: var(--warning-text); border: 1px solid #ffecb5; }

    #info-extra { margin-top: 14px; }
    .result-card {
      padding: 15px;
      background: #f8f9fa;
      border: 1px solid var(--border);
      border-left: 5px solid var(--cyan);
      border-radius: 5px;
    }
    .result-card p { margin: 0 0 10px; font-size: 14px; }
    .result-card small { color: var(--muted); }
    .result-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 13px; }
    .class-summary { margin: 10px 0 0; padding-left: 20px; }
    .class-summary li { margin: 3px 0; }

    .hidden { display: none !important; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 600px) {
      body { padding: 8px; }
      .app-container { padding: 14px; }
      .controls-grid { grid-template-columns: 1fr; }
      #map { height: 360px; }
      .result-actions > * { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <main class="app-container">
    <header class="header">
      <i class="fa-solid fa-satellite" aria-hidden="true"></i>
      <h1>DF Legal | Detecção Inteligente SR2D4</h1>
    </header>

    <section aria-labelledby="step-one-title">
      <div class="step-title" id="step-one-title">
        <i class="fa-regular fa-calendar" aria-hidden="true"></i>
        1º Passo: defina o período e o limite de nuvens
      </div>
      <div class="controls-grid">
        <div class="form-group">
          <label for="data_inicio">Data 1 (referência)</label>
          <input type="date" id="data_inicio" required>
        </div>
        <div class="form-group">
          <label for="data_fim">Data 2 (atual)</label>
          <input type="date" id="data_fim" required>
          <small id="date-help" style="display:block;margin-top:5px;color:var(--muted);font-size:12px;"></small>
        </div>
        <div class="form-group">
          <label for="cloud_cover">Máx. nuvens: <span id="cloud-val">20</span>%</label>
          <div class="slider-container">
            <input type="range" id="cloud_cover" min="0" max="100" value="20">
          </div>
        </div>
        <div class="form-group">
          <label for="file_upload">Subir AOI (GeoJSON)</label>
          <input type="file" id="file_upload" accept=".geojson,.json,application/geo+json,application/json">
        </div>
      </div>
    </section>

    <section aria-labelledby="step-two-title">
      <div class="step-title" id="step-two-title">
        <i class="fa-solid fa-draw-polygon" aria-hidden="true"></i>
        2º Passo: desenhe a área de interesse no mapa ou carregue um GeoJSON
      </div>
      <p class="map-help">O retângulo desenhado será enviado como AOI para o Earth Engine.</p>
      <div id="map" aria-label="Mapa para desenho da área de interesse"></div>
    </section>

    <button class="btn-primary" id="btn-processar" type="button">
      <i class="fa-solid fa-microchip" aria-hidden="true"></i>
      3º Passo: iniciar processamento
    </button>

    <div id="status-box" role="status" aria-live="polite"></div>
    <div id="info-extra"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/digidem/leaflet-side-by-side@2.2.0/leaflet-side-by-side.min.js"></script>

  <script>
    (() => {
      "use strict";

      const WEBHOOK_URL = "https://backend-dflegal.onrender.com/rodar-deteccao";
      const DEFAULT_SR2D4_URL = "https://colab.research.google.com/drive/1EMOKxmlOEJcRaFGxAcnjfx2l67BpVwHg";

      const statusBox = document.getElementById("status-box");
      const infoBox = document.getElementById("info-extra");
      const processButton = document.getElementById("btn-processar");
      const cloudInput = document.getElementById("cloud_cover");
      const cloudValue = document.getElementById("cloud-val");
      const fileInput = document.getElementById("file_upload");
      const dateHelp = document.getElementById("date-help");

      function localDateToISO(date = new Date()) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function addDaysToISO(isoDate, days) {
        const [year, month, day] = isoDate.split("-").map(Number);
        const date = new Date(year, month - 1, day);
        date.setDate(date.getDate() + days);
        return localDateToISO(date);
      }

      function formatISODateBR(isoDate) {
        const [year, month, day] = isoDate.split("-");
        return `${day}/${month}/${year}`;
      }

      function updateDateHelp() {
        dateHelp.textContent = "A Data 2 pode ser recente. O sistema procura automaticamente a cena Sentinel-2 disponível mais próxima da data informada.";
      }

      updateDateHelp();

      cloudInput.addEventListener("input", () => {
        cloudValue.textContent = cloudInput.value;
      });

      const map = L.map("map", { preferCanvas: true }).setView([-15.7942, -47.8821], 10);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap contributors",
        zIndex: 200
      }).addTo(map);

      // Panes independentes: o plugin aplica clip somente nos containers dos
      // dois tiles Sentinel, nunca no pane do OpenStreetMap.
      map.createPane("sentinelBefore");
      map.getPane("sentinelBefore").style.zIndex = 410;
      map.createPane("sentinelAfter");
      map.getPane("sentinelAfter").style.zIndex = 420;

      const drawnItems = new L.FeatureGroup().addTo(map);
      new L.Control.Draw({
        draw: {
          polyline: false,
          polygon: false,
          circle: false,
          marker: false,
          circlemarker: false,
          rectangle: {
            shapeOptions: { color: "#0056b3", weight: 3 }
          }
        },
        edit: { featureGroup: drawnItems }
      }).addTo(map);

      let aoiGeoJSON = null;
      let sentinelBefore = null;
      let sentinelAfter = null;
      let swipeControl = null;

      function syncAoiFromMap() {
        aoiGeoJSON = drawnItems.getLayers().length ? drawnItems.toGeoJSON() : null;
      }

      map.on(L.Draw.Event.CREATED, (event) => {
        drawnItems.clearLayers();
        drawnItems.addLayer(event.layer);
        syncAoiFromMap();
      });
      map.on(L.Draw.Event.EDITED, syncAoiFromMap);
      map.on(L.Draw.Event.DELETED, syncAoiFromMap);

      fileInput.addEventListener("change", () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const geojson = JSON.parse(event.target.result);
            const layer = L.geoJSON(geojson);
            if (!layer.getBounds().isValid()) {
              throw new Error("O GeoJSON não contém uma geometria espacial válida.");
            }
            drawnItems.clearLayers();
            drawnItems.addLayer(layer);
            map.fitBounds(layer.getBounds(), { padding: [20, 20] });
            syncAoiFromMap();
            mostrarStatus("AOI carregada. Confira a área no mapa antes de processar.", "success");
          } catch (error) {
            fileInput.value = "";
            aoiGeoJSON = null;
            mostrarStatus(`GeoJSON inválido: ${error.message}`, "error");
          }
        };
        reader.readAsText(file);
      });

      function destruirSwipe() {
        if (swipeControl) {
          swipeControl.remove();
          swipeControl = null;
        }
        if (sentinelBefore) {
          sentinelBefore.remove();
          sentinelBefore = null;
        }
        if (sentinelAfter) {
          sentinelAfter.remove();
          sentinelAfter = null;
        }
      }

      function criarSwipe(tileBefore, tileAfter) {
        destruirSwipe();
        if (!tileBefore || !tileAfter || typeof L.control.sideBySide !== "function") {
          throw new Error("O plugin de swipe não foi carregado ou os tiles não foram retornados.");
        }

        sentinelBefore = L.tileLayer(tileBefore, {
          pane: "sentinelBefore",
          zIndex: 410,
          maxZoom: 19,
          crossOrigin: true
        }).addTo(map);
        sentinelAfter = L.tileLayer(tileAfter, {
          pane: "sentinelAfter",
          zIndex: 420,
          maxZoom: 19,
          crossOrigin: true
        }).addTo(map);

        // left = Antes; right = Depois. O controle corta apenas os containers
        // destes dois TileLayers.
        swipeControl = L.control.sideBySide(sentinelBefore, sentinelAfter).addTo(map);
      }

      function mostrarStatus(mensagem, tipo) {
        statusBox.hidden = false;
        statusBox.style.display = "block";
        statusBox.className = `status-${tipo}`;
        statusBox.textContent = mensagem;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderClassSummary(summary) {
        const entries = Object.entries(summary || {});
        if (!entries.length) return "<li>Nenhuma classe detectada.</li>";
        return entries
          .map(([label, count]) => `<li><strong>${escapeHtml(label)}:</strong> ${escapeHtml(count)} área(s)</li>`)
          .join("");
      }

      async function parseResponse(response) {
        const text = await response.text();
        let data;
        try {
          data = text ? JSON.parse(text) : {};
        } catch {
          throw new Error(`Resposta inválida do servidor (HTTP ${response.status}).`);
        }
        if (!response.ok || data.status === "erro") {
          const receivedDate = data.data_solicitada2
            ? ` Data 2 recebida pelo servidor: ${formatISODateBR(data.data_solicitada2)}.`
            : "";
          throw new Error((data.mensagem || `Servidor respondeu HTTP ${response.status}.`) + receivedDate);
        }
        return data;
      }

      function renderResult(data) {
        const sr2d4Url = data.colab_url || DEFAULT_SR2D4_URL;
        const total = Number(data.total_detectado || 0);
        const before = data.data_real1_display || data.data_real1 || "não informado";
        const after = data.data_real2_display || data.data_real2 || "não informado";
        const requestedBefore = data.data_solicitada1_display || data.data_solicitada1 || "não informado";
        const requestedAfter = data.data_solicitada2_display || data.data_solicitada2 || "não informado";

        infoBox.innerHTML = `
          <div class="result-card">
            <p><strong>Período solicitado:</strong><br>
              Data 1: <strong>${escapeHtml(requestedBefore)}</strong> &nbsp;|&nbsp;
              Data 2: <strong>${escapeHtml(requestedAfter)}</strong>
            </p>
            <p><strong>Imagens Sentinel-2 realmente usadas:</strong><br>
              Antes: <strong>${escapeHtml(before)}</strong> &nbsp;|&nbsp;
              Depois: <strong>${escapeHtml(after)}</strong>
            </p>
            <small>As duas imagens de 10 m foram carregadas no mapa. Arraste a cortina branca no centro do mapa; o mapa-base não participa do swipe.</small>
            <ul class="class-summary">${renderClassSummary(data.resumo_classes)}</ul>
            <div class="result-actions">
              <button class="btn-swipe" id="toggle-swipe" type="button">
                <i class="fa-solid fa-sliders" aria-hidden="true"></i> Desligar swipe
              </button>
              <a class="btn-secondary" href="${escapeHtml(sr2d4Url)}" target="_blank" rel="noopener noreferrer">
                <i class="fa-solid fa-microscope" aria-hidden="true"></i>
                4º Passo: abrir SR2D4/Colab em nova aba
              </a>
            </div>
            <small>Execução: ${escapeHtml(data.id_execucao || "não informado")} | ${total} área(s) detectada(s) | ${Number(data.total_inserido || 0)} acumulada(s) no ArcGIS.</small>
          </div>`;

        const toggleButton = document.getElementById("toggle-swipe");
        let swipeOn = true;
        toggleButton.addEventListener("click", () => {
          if (swipeOn) {
            if (swipeControl) swipeControl.remove();
            toggleButton.innerHTML = '<i class="fa-solid fa-sliders" aria-hidden="true"></i> Ligar swipe';
          } else {
            swipeControl = L.control.sideBySide(sentinelBefore, sentinelAfter).addTo(map);
            toggleButton.innerHTML = '<i class="fa-solid fa-sliders" aria-hidden="true"></i> Desligar swipe';
          }
          swipeOn = !swipeOn;
        });
      }

      async function dispararProcessamento() {
        const dataInicio = document.getElementById("data_inicio").value;
        const dataFim = document.getElementById("data_fim").value;
        const nuvens = Number(cloudInput.value);

        if (!dataInicio || !dataFim || !aoiGeoJSON) {
          mostrarStatus("Preencha as duas datas e desenhe/carregue a área de interesse.", "error");
          return;
        }
        if (dataInicio > dataFim) {
          mostrarStatus("Data 1 deve ser anterior ou igual à Data 2.", "error");
          return;
        }

        const hoje = localDateToISO();

        if (dataFim > hoje) {
          mostrarStatus("A Data 2 não pode estar no futuro.", "error");
          return;
        }

        processButton.disabled = true;
        processButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> Processando...';
        infoBox.innerHTML = "";
        destruirSwipe();
        mostrarStatus(
          `Enviando Data 1 ${formatISODateBR(dataInicio)} e Data 2 ${formatISODateBR(dataFim)}. Buscando as cenas Sentinel-2 mais próximas; o processamento pode levar alguns minutos.`,
          "loading"
        );

        const controller = new AbortController();
        const timeoutId = window.setTimeout(() => controller.abort(), 190000);

        try {
          const response = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            cache: "no-store",
            body: JSON.stringify({
              data_inicio: dataInicio,
              data_fim: dataFim,
              nuvens,
              geometria: aoiGeoJSON
            }),
            signal: controller.signal
          });
          const data = await parseResponse(response);

          criarSwipe(data.tile1, data.tile2);
          mostrarStatus(`Sucesso: ${data.mensagem}`, "success");
          renderResult(data);
        } catch (error) {
          const message = error.name === "AbortError"
            ? "O processamento excedeu o tempo de espera do navegador. Confira os logs do Render antes de repetir."
            : error.message || "Erro de comunicação com o servidor.";
          mostrarStatus(`Erro: ${message}`, "error");
        } finally {
          window.clearTimeout(timeoutId);
          processButton.disabled = false;
          processButton.innerHTML = '<i class="fa-solid fa-microchip" aria-hidden="true"></i> 3º Passo: iniciar processamento';
        }
      }

      processButton.addEventListener("click", dispararProcessamento);
    })();
  </script>
</body>
</html>
